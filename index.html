    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;500;600;700&display=swap');

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #040410;
            color: #e0e6ed;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* ════════════════════════════════════
           GALAXY  —  multi-layer CSS nebula
           ════════════════════════════════════ */
        body::before,
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                /* Milky-way diagonal band */
                linear-gradient(145deg, transparent 15%, rgba(90, 60, 180, 0.07) 30%, rgba(120, 80, 220, 0.10) 48%, rgba(90, 60, 180, 0.07) 66%, transparent 82%),
                /* Large nebula clouds */
                radial-gradient(ellipse 85% 65% at 12% 58%, rgba(130, 40, 220, 0.14) 0%, transparent 60%),
                radial-gradient(ellipse 75% 55% at 88% 22%, rgba(0, 90, 240, 0.12) 0%, transparent 55%),
                radial-gradient(ellipse 95% 75% at 50% 88%, rgba(0, 210, 255, 0.09) 0%, transparent 50%),
                radial-gradient(ellipse 55% 45% at 72% 62%, rgba(200, 0, 255, 0.08) 0%, transparent 45%),
                radial-gradient(ellipse 45% 35% at 22% 28%, rgba(255, 80, 120, 0.05) 0%, transparent 40%),
                radial-gradient(ellipse 60% 50% at 40% 15%, rgba(60, 0, 180, 0.08) 0%, transparent 50%);
        }

        body::after {
            background:
                radial-gradient(ellipse 65% 55% at 28% 18%, rgba(0, 160, 255, 0.07) 0%, transparent 50%),
                radial-gradient(ellipse 45% 35% at 62% 42%, rgba(120, 0, 220, 0.06) 0%, transparent 45%),
                radial-gradient(ellipse 55% 45% at 82% 78%, rgba(0, 200, 180, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse 40% 30% at 8% 82%, rgba(170, 50, 220, 0.07) 0%, transparent 40%),
                radial-gradient(ellipse 50% 40% at 55% 65%, rgba(80, 40, 160, 0.05) 0%, transparent 45%),
                /* Subtle warm patch */
                radial-gradient(ellipse 35% 25% at 92% 55%, rgba(255, 150, 50, 0.035) 0%, transparent 40%);
            animation: nebula-drift 22s ease-in-out infinite alternate;
        }

        @keyframes nebula-drift {
            0% {
                opacity: .65;
                transform: scale(1) translate(0, 0);
            }

            100% {
                opacity: 1;
                transform: scale(1.1) translate(18px, -12px);
            }
        }

        /* Vignette */
        #vignette {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse 70% 70% at 50% 50%, transparent 40%, rgba(4, 4, 16, 0.6) 100%);
        }

        .tech-mono {
            font-family: 'Share Tech Mono', monospace
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            touch-action: none
        }

        /* ── Loader ── */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #040410;
            display: flex;
            align-items: center;
            justify-content: center
        }

        @keyframes scan-line {
            0% {
                width: 0
            }

            50% {
                width: 100%
            }

            100% {
                width: 0
            }
        }

        .scan-bar {
            width: 120px;
            height: 2px;
            background: rgba(0, 240, 255, .1);
            border-radius: 1px;
            overflow: hidden;
            margin-top: 12px
        }

        .scan-bar::after {
            content: '';
            display: block;
            height: 100%;
            background: #00f0ff;
            animation: scan-line 1.5s ease-in-out infinite
        }

        /* ── Header ── */
        .header-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: .75rem 1.5rem;
            background: linear-gradient(to bottom, rgba(4, 4, 16, .92) 0%, rgba(4, 4, 16, .4) 70%, transparent 100%);
            transition: opacity .3s
        }

        @media(min-width:768px) {
            .header-overlay {
                padding: 1rem 2rem
            }
        }

        .header-overlay.panel-open {
            opacity: .3;
            pointer-events: none
        }

        /* ── Panel ──
             FIX: z-index 150 when active → above header (100) */
        .content-panel {
            position: fixed;
            z-index: 50;
            background: rgba(6, 6, 20, .92);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(0, 240, 255, .12);
            overflow-y: auto;
            overflow-x: hidden;
            transition: transform .55s cubic-bezier(.16, 1, .3, 1), opacity .4s ease;
            opacity: 0;
            pointer-events: none
        }

        .content-panel.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 150
        }

        @media(min-width:768px) {
            .content-panel {
                top: 0;
                left: 0;
                width: 44%;
                max-width: 560px;
                height: 100vh;
                transform: translateX(-100%);
                border-right: 1px solid rgba(0, 240, 255, .15);
                padding: 2rem 2.5rem 3rem
            }

            .content-panel.active {
                transform: translateX(0)
            }
        }

        @media(max-width:767px) {
            .content-panel {
                bottom: 0;
                left: 0;
                right: 0;
                height: 78vh;
                border-top-left-radius: 1.25rem;
                border-top-right-radius: 1.25rem;
                transform: translateY(100%);
                padding: 1rem 1.25rem 5rem;
                border-top: 1px solid rgba(0, 240, 255, .2)
            }

            .content-panel.active {
                transform: translateY(0)
            }
        }

        .content-panel::-webkit-scrollbar {
            width: 3px
        }

        .content-panel::-webkit-scrollbar-track {
            background: transparent
        }

        .content-panel::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, .25);
            border-radius: 2px
        }

        .glow-cyan {
            text-shadow: 0 0 8px rgba(0, 240, 255, .5), 0 0 20px rgba(0, 240, 255, .25)
        }

        .glow-purple {
            text-shadow: 0 0 8px rgba(189, 0, 255, .5), 0 0 20px rgba(189, 0, 255, .25)
        }

        .glow-green {
            text-shadow: 0 0 8px rgba(57, 255, 20, .5), 0 0 20px rgba(57, 255, 20, .25)
        }

        /* ── Mobile Nav ── */
        .mobile-nav {

            bottom: 0;
            left: 0;
            right: 0;
            z-index: 200;
            background: rgba(4, 4, 16, .96);

        }

        @media(max-width:767px) {

        .mobile-nav-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: .35rem 0;
            color: rgba(224, 230, 237, .4);

            cursor: pointer;
            border: none;
            background: none;
            font-family: 'Share Tech Mono', monospace;
            font-size: .6rem
        }

        .mobile-nav-btn.active,

            color: #00f0ff
        }

        /* ── Close btn ── */
        .close-btn {
            position: sticky;
            top: 0;
            float: right;
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 50%;
            border: 1px solid rgba(0, 240, 255, .3);
            background: rgba(0, 240, 255, .1);
            color: #00f0ff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all .3s;
            z-index: 10;
            margin-bottom: .5rem
        }

        .close-btn:hover {
            background: rgba(0, 240, 255, .25);
            border-color: #00f0ff;
            transform: scale(1.1)
        }

        .drag-handle {
            width: 2.5rem;
            height: .2rem;
            background: rgba(255, 255, 255, .25);
            border-radius: 2px;
            margin: 0 auto .75rem
        }

        .section-label {
            display: inline-block;
            padding: .2rem .6rem;
            border: 1px solid rgba(0, 240, 255, .25);
            border-radius: .2rem;
            font-size: .65rem;
            letter-spacing: .15em;
            text-transform: uppercase;
            color: #00f0ff;
            margin-bottom: .75rem
        }

        .skill-tag {
            display: inline-block;
            padding: .3rem .65rem;
            border-radius: 9999px;
            font-size: .7rem;
            border: 1px solid rgba(0, 240, 255, .18);
            background: rgba(0, 240, 255, .04);
            color: #00f0ff;
            margin: .2rem;
            transition: all .3s
        }

        .skill-tag:hover {
            background: rgba(0, 240, 255, .12);
            border-color: rgba(0, 240, 255, .4)
        }

        .project-card {
            background: rgba(0, 240, 255, .02);
            border: 1px solid rgba(0, 240, 255, .1);
            border-radius: .75rem;
            padding: 1.25rem;

        .project-card:hover {

        .metric-track {

        .metric-fill {
            height: 100%;

        .terminal {
            background: rgba(4, 4, 16, .7);

            border-radius: .5rem;
            font-family: 'Share Tech Mono', monospace;

            content: '> ';

        @keyframes pulse-glow {

            0%,

                opacity: .55
            }

    </style>
</head>

            for (let i = 0; i < count;) {

                // Prevent stars from spawning too close to the globe or camera (radius 18)

                pos[i * 3] = x;

        // L1: far faint dust
        const sDust = makeStars(IS_M ? 6000 : 15000, 150, 0.04, '#556688', 0.45);

        const sCool = makeStars(IS_M ? 150 : 400, 95, 0.14, '#aa88ff', 0.60);

        // ═══════════════════════════════════════════════
        // ★ SHOOTING STARS  (bigger + visible head glow)

            // ── Bright head point ──

                vx, vy, vz, tailF, offset,
                life: 0,

        function updateSS(dt) {

                s.pos1[3] = s.pos1[0] - s.vx * s.tailF;

        const LCOUNT = IS_M ? 50 : 100, lPos = new Float32Array(LCOUNT * 6), lGeo = new THREE.BufferGeometry();

            let idx = 0;
            for (let a = 0; a < LCOUNT * 8 && idx < LCOUNT; a++) {
                const i = Math.floor(Math.random() * PCOUNT), j = Math.floor(Math.random() * PCOUNT);
                const dx = pPos[i * 3] - pPos[j * 3], dy = pPos[i * 3 + 1] - pPos[j * 3 + 1], dz = pPos[i * 3 + 2] - pPos[j * 3 + 2];
                const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
                if (d < GR * 1.15 && d > 0.3) { lPos[idx * 6] = pPos[i * 3]; lPos[idx * 6 + 1] = pPos[i * 3 + 1]; lPos[idx * 6 + 2] = pPos[i * 3 + 2]; lPos[idx * 6 + 3] = pPos[j * 3]; lPos[idx * 6 + 4] = pPos[j * 3 + 1]; lPos[idx * 6 + 5] = pPos[j * 3 + 2]; idx++; }
            }
            lGeo.setAttribute('position', new THREE.BufferAttribute(lPos, 3));
            if (lGeo.attributes.position) lGeo.attributes.position.needsUpdate = true;
        }
        genLines();
        const lMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: .12, blending: THREE.AdditiveBlending, depthWrite: false });
        globeGroup.add(new THREE.LineSegments(lGeo, lMat));
        setInterval(() => { gsap.to(lMat, { opacity: .02, duration: .35, onComplete() { genLines(); gsap.to(lMat, { opacity: .12, duration: .55 }); } }); }, 3500);

        // Orbital rings
        function mkRing(rx, rz, off) {
            const r = new THREE.Mesh(new THREE.RingGeometry(GR + off, GR + off + 0.02, 128), new THREE.MeshBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: .06, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
            r.rotation.x = rx; r.rotation.z = rz; globeGroup.add(r); return r;
        }
        const ring1 = mkRing(Math.PI / 2, 0, .55);
        const ring2 = mkRing(Math.PI * .35, Math.PI * .15, .55);

        // ═══════════════════════════════════════════════
        // ★ CORE NODES  — NEW colour palette
        //   About:    Cyan   #00d4ff
        //   Skills:   Pink   #ff2d78
        //   Projects: Emerald #00ff88
        //   Contact:  Amber  #ffaa00
        // ═══════════════════════════════════════════════
        const coreNodeMeshes = {};
        const nodeGroups = {};
        const NODE_DATA = [
            { name: 'about', label: 'ABOUT', color: 0x00d4ff, hex: '#00d4ff', phi: Math.PI * 0.3, theta: 0 },
            { name: 'skills', label: 'SKILLS', color: 0xff2d78, hex: '#ff2d78', phi: Math.PI * 0.55, theta: Math.PI * 0.55 },
            { name: 'projects', label: 'PROJECTS', color: 0x00ff88, hex: '#00ff88', phi: Math.PI * 0.4, theta: Math.PI * 1.15 },
            { name: 'contact', label: 'CONTACT', color: 0xffaa00, hex: '#ffaa00', phi: Math.PI * 0.72, theta: Math.PI * 1.7 }
        ];
        const NSIZE = IS_M ? 0.18 : 0.14;

        NODE_DATA.forEach(d => {
            const x = GR * Math.sin(d.phi) * Math.cos(d.theta);
            const y = GR * Math.cos(d.phi);
            const z = GR * Math.sin(d.phi) * Math.sin(d.theta);
            const dir = new THREE.Vector3(x, y, z).normalize();

            const nG = new THREE.Group();
            nG.position.set(x, y, z);

            // Core sphere
            const core = new THREE.Mesh(new THREE.SphereGeometry(NSIZE, 16, 16), new THREE.MeshBasicMaterial({ color: d.color, transparent: true, opacity: 1 }));
            core.userData = { tabName: d.name };
            nG.add(core);
            coreNodeMeshes[d.name] = core;

            // Large halo
            nG.add(new THREE.Mesh(new THREE.SphereGeometry(NSIZE * 4, 16, 16), new THREE.MeshBasicMaterial({ color: d.color, transparent: true, opacity: .08, blending: THREE.AdditiveBlending, depthWrite: false })));
            // Inner glow
            const ig = new THREE.Mesh(new THREE.SphereGeometry(NSIZE * 2, 16, 16), new THREE.MeshBasicMaterial({ color: d.color, transparent: true, opacity: .15, blending: THREE.AdditiveBlending, depthWrite: false }));
            nG.add(ig);

            // Ring 1
            const r1 = new THREE.Mesh(new THREE.RingGeometry(NSIZE * 2.2, NSIZE * 2.5, 48), new THREE.MeshBasicMaterial({ color: d.color, transparent: true, opacity: .35, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
            nG.add(r1);
            // Ring 2
            const r2 = new THREE.Mesh(new THREE.RingGeometry(NSIZE * 3.0, NSIZE * 3.2, 48), new THREE.MeshBasicMaterial({ color: d.color, transparent: true, opacity: .15, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
            r2.rotation.x = Math.PI * .4; r2.rotation.y = Math.PI * .3;
            nG.add(r2);

            // Beacon line
            const bGeo = new THREE.BufferGeometry();
            bGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0, 0, 0, dir.x * .6, dir.y * .6, dir.z * .6]), 3));
            nG.add(new THREE.Line(bGeo, new THREE.LineBasicMaterial({ color: d.color, transparent: true, opacity: .4, blending: THREE.AdditiveBlending, depthWrite: false })));

            // Label sprite with pill background
            const cvs = document.createElement('canvas');
            cvs.width = 512; cvs.height = 128;
            const ctx = cvs.getContext('2d');
            // Pill BG
            const pW = 320, pH = 70, pX = (512 - pW) / 2, pY = 25;
            ctx.fillStyle = 'rgba(4,4,16,0.65)';
            ctx.beginPath();
            // roundRect fallback
            if (ctx.roundRect) { ctx.roundRect(pX, pY, pW, pH, 12); }
            else { ctx.moveTo(pX + 12, pY); ctx.lineTo(pX + pW - 12, pY); ctx.quadraticCurveTo(pX + pW, pY, pX + pW, pY + 12); ctx.lineTo(pX + pW, pY + pH - 12); ctx.quadraticCurveTo(pX + pW, pY + pH, pX + pW - 12, pY + pH); ctx.lineTo(pX + 12, pY + pH); ctx.quadraticCurveTo(pX, pY + pH, pX, pY + pH - 12); ctx.lineTo(pX, pY + 12); ctx.quadraticCurveTo(pX, pY, pX + 12, pY); ctx.closePath(); }
            ctx.fill();
            ctx.strokeStyle = d.hex; ctx.lineWidth = 2; ctx.shadowColor = d.hex; ctx.shadowBlur = 15; ctx.stroke();
            ctx.font = 'bold 36px Share Tech Mono'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = d.hex; ctx.shadowBlur = 20; ctx.fillText(d.label, 256, 60);

            const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cvs), transparent: true, opacity: .95, depthWrite: false }));
            const lD = IS_M ? 1.1 : 0.9;
            spr.position.set(dir.x * lD, dir.y * lD + 0.45, dir.z * lD);
            spr.scale.set(IS_M ? 2.2 : 1.8, IS_M ? 0.55 : 0.45, 1);
            nG.add(spr);

            globeGroup.add(nG);
            nodeGroups[d.name] = { group: nG, ring: r1, ring2: r2, halo: nG.children[1], innerGlow: ig, core };
        });

        // ═══════════════════════════════════════════════
        // INTERACTION
        // ═══════════════════════════════════════════════
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(-999, -999);
        let isDragging = false, prevPtr = { x: 0, y: 0 }, autoRotate = true, rotVel = { x: 0, y: 0 }, hoveredNode = null;

        function ptr(e) { const t = e.touches ? e.touches[0] : e; return { x: t.clientX, y: t.clientY } }
        function onDown(e) { prevPtr = ptr(e); isDragging = true; autoRotate = false; rotVel = { x: 0, y: 0 } }
        function onMove(e) {
            const p = ptr(e);
            mouse.x = (p.x / window.innerWidth) * 2 - 1; mouse.y = -(p.y / window.innerHeight) * 2 + 1;
            if (isDragging) { const dx = p.x - prevPtr.x, dy = p.y - prevPtr.y; globeGroup.rotation.y += dx * .005; globeGroup.rotation.x = Math.max(-1, Math.min(1, globeGroup.rotation.x + dy * .005)); rotVel = { x: dy * .005, y: dx * .005 }; prevPtr = p }
        }
        function onUp() { isDragging = false; setTimeout(() => { if (!isDragging) autoRotate = true }, 3000) }

        container.addEventListener('mousedown', onDown); container.addEventListener('mousemove', onMove); container.addEventListener('mouseup', onUp); container.addEventListener('mouseleave', () => { isDragging = false }); container.addEventListener('click', e => tryClick(e.clientX, e.clientY));
        let tS = { x: 0, y: 0, t: 0 };
        container.addEventListener('touchstart', e => { const p = ptr(e); tS = { x: p.x, y: p.y, t: Date.now() }; onDown(e) }, { passive: true });
        container.addEventListener('touchmove', e => onMove(e), { passive: true });
        container.addEventListener('touchend', e => { onUp(); const p = e.changedTouches ? e.changedTouches[0] : tS; if (Date.now() - tS.t < 300 && Math.hypot(p.clientX - tS.x, p.clientY - tS.y) < 18) tryClick(p.clientX, p.clientY) }, { passive: true });

        function tryClick(cx, cy) {
            mouse.x = (cx / window.innerWidth) * 2 - 1; mouse.y = -(cy / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(Object.values(coreNodeMeshes));
            if (hits.length && hits[0].object.userData.tabName) openTab(hits[0].object.userData.tabName);
        }

        // ═══════════════════════════════════════════════
        // RENDER LOOP
        // ═══════════════════════════════════════════════
        let time = 0;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            time += 0.01;

            if (autoRotate && !isDragging) globeGroup.rotation.y += 0.0018;
            if (!isDragging && !autoRotate) { globeGroup.rotation.y += rotVel.y; globeGroup.rotation.x += rotVel.x; rotVel.x *= .94; rotVel.y *= .94; }

            // Node animations
            Object.entries(nodeGroups).forEach(([_, nd], i) => {
                const pulse = 1 + Math.sin(time * 2.5 + i * 1.6) * .08;
                nd.ring.rotation.x += .015 + i * .003; nd.ring.rotation.z += .01;
                nd.ring2.rotation.y += .012; nd.ring2.rotation.z -= .008;
                nd.halo.scale.setScalar(1 + Math.sin(time * 1.8 + i * 2) * .15);
                nd.halo.material.opacity = .06 + Math.sin(time * 2 + i) * .03;
                nd.innerGlow.scale.setScalar(pulse);
                nd.innerGlow.material.opacity = .12 + Math.sin(time * 3 + i * 1.3) * .06;
                if (nd.core !== hoveredNode) nd.core.scale.setScalar(pulse);
            });

            lMat.opacity = .09 + Math.sin(time * .6) * .04;
            ring1.rotation.z = time * .08; ring2.rotation.z = -time * .06;

            // Star parallax rotation + twinkling
            sDust.rotation.y += .00006; sDust.rotation.x += .00002;
            sMid.rotation.y += .00012; sMid.rotation.x += .00004;
            sBright.rotation.y += .0002; sBright.rotation.x += .00006;
            sWarm.rotation.y -= .00008;
            sCool.rotation.y += .00015;
            sBright.material.opacity = .65 + Math.sin(time * 1.3) * .12;
            sWarm.material.opacity = .55 + Math.sin(time * 1.0 + 1) * .15;
            sCool.material.opacity = .50 + Math.sin(time * 1.6 + 2) * .12;

            updateSS(dt);
            updateHover();
            renderer.render(scene, camera);
        }

        function updateHover() {
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(Object.values(coreNodeMeshes));
            if (hoveredNode && (!hits.length || hits[0].object !== hoveredNode)) {
                gsap.to(hoveredNode.scale, { x: 1, y: 1, z: 1, duration: .25 });
                hoveredNode.material.opacity = 1;
                container.style.cursor = 'grab';
                hoveredNode = null;
            }
            if (hits.length && hits[0].object.userData.tabName) {
                const n = hits[0].object;
                if (n !== hoveredNode) { hoveredNode = n; gsap.to(n.scale, { x: 1.5, y: 1.5, z: 1.5, duration: .25 }); n.material.opacity = 1; container.style.cursor = 'pointer'; }
            }
        }

        // ═══════════════════════════════════════════════
        // RESIZE
        // ═══════════════════════════════════════════════
        window.addEventListener('resize', () => {
            const w = window.innerWidth, h = window.innerHeight;
            camera.aspect = w / h; camera.fov = w < 768 ? 65 : 55; camera.position.z = w < 768 ? 9.5 : 8.8;
            camera.updateProjectionMatrix(); renderer.setSize(w, h);
        });

        // ═══════════════════════════════════════════════
        // BOOT
        // ═══════════════════════════════════════════════
        window.addEventListener('load', () => {
            animate();
            setTimeout(() => { gsap.to('#loader', { opacity: 0, duration: .7, onComplete() { document.getElementById('loader').style.display = 'none' } }); }, 1400);
        });
    </script>
</body>

</html>
